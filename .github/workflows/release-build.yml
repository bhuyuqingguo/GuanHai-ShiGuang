name: Desktop release builds

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['release/**']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r optical_desk/requirements.txt "pyinstaller>=6,<7"
      - name: Run Windows and encrypted transfer tests
        env:
          PYTHONPATH: ${{ github.workspace }}/optical_desk
        run: |
          python -m unittest discover -s optical_desk/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -v
      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --clean build/GuanHaiShiGuang.spec
      - name: Archive portable package
        run: |
          Compress-Archive -LiteralPath dist/GuanHaiShiGuang/GuanHaiShiGuang.exe,dist/GuanHaiShiGuang/runtime -DestinationPath dist/GuanHaiShiGuang-0.0.6-Windows-x64.zip
      - name: Verify first launch from the extracted package
        run: ./build/check-windows-portable.ps1 -Package dist/GuanHaiShiGuang-0.0.6-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-x64
          path: dist/GuanHaiShiGuang-0.0.6-Windows-x64.zip
          if-no-files-found: error

  kylin:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Kylin Desktop V10 SP1 uses glibc 2.31 on AMD64 and ARM64.
    container: python:3.11-bullseye
    defaults:
      run:
        shell: bash
        working-directory: kylin_desk
    steps:
      - uses: actions/checkout@v4
      - name: Install smoke test tools
        run: |
          printf '%s\n' 'deb https://deb.debian.org/debian bullseye main' > /tmp/guanhai-apt.list
          apt_sources=(-o Dir::Etc::sourcelist=/tmp/guanhai-apt.list -o Dir::Etc::sourceparts=-)
          apt-get "${apt_sources[@]}" update
          apt-get "${apt_sources[@]}" install -y --no-install-recommends libxcursor1 xvfb xauth x11-utils openbox wmctrl desktop-file-utils
      - name: Run Linux tests
        run: python -m unittest discover -s tests -v
      - name: Build the offline executable
        run: |
          bash prepare_offline_deps.sh
          bash prepare_xorriso.sh
          bash build_offline.sh
      - name: Archive portable package
        run: |
          tar -czf "dist/GuanHaiShiGuang-0.0.2-Kylin-V10-SP1-${{ matrix.architecture }}.tar.gz" \
            -C dist/GuanHaiShiGuang GuanHaiShiGuang runtime
      - name: Verify first launch from the extracted package
        run: |
          bash ../build/check-kylin-portable.sh "dist/GuanHaiShiGuang-0.0.2-Kylin-V10-SP1-${{ matrix.architecture }}.tar.gz" "${{ matrix.architecture }}"
      - uses: actions/upload-artifact@v4
        with:
          name: Kylin-${{ matrix.architecture }}
          path: kylin_desk/dist/GuanHaiShiGuang-0.0.2-Kylin-V10-SP1-${{ matrix.architecture }}.tar.gz
          if-no-files-found: error

  stage-release:
    if: github.ref_type == 'tag'
    needs: [windows, kylin]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify and upload release files to the draft
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          windows=GuanHaiShiGuang-0.0.6-Windows-x64.zip
          amd64=GuanHaiShiGuang-0.0.2-Kylin-V10-SP1-amd64.tar.gz
          arm64=GuanHaiShiGuang-0.0.2-Kylin-V10-SP1-arm64.tar.gz
          unzip -p "$windows" GuanHaiShiGuang.exe > "$RUNNER_TEMP/GuanHaiShiGuang.exe"
          file "$RUNNER_TEMP/GuanHaiShiGuang.exe" | grep 'PE32+.*x86-64'
          mkdir -p "$RUNNER_TEMP/guanhai-amd64" "$RUNNER_TEMP/guanhai-arm64"
          tar -xzf "$amd64" -C "$RUNNER_TEMP/guanhai-amd64" GuanHaiShiGuang
          tar -xzf "$arm64" -C "$RUNNER_TEMP/guanhai-arm64" GuanHaiShiGuang
          test -x "$RUNNER_TEMP/guanhai-amd64/GuanHaiShiGuang"
          test -x "$RUNNER_TEMP/guanhai-arm64/GuanHaiShiGuang"
          file "$RUNNER_TEMP/guanhai-amd64/GuanHaiShiGuang" | grep 'ELF.*x86-64'
          file "$RUNNER_TEMP/guanhai-arm64/GuanHaiShiGuang" | grep 'ELF.*aarch64'
          sha256sum "$windows" "$amd64" "$arm64" | tee SHA256SUMS.txt
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
          gh release upload "$GITHUB_REF_NAME" "$windows" "$amd64" "$arm64" SHA256SUMS.txt
