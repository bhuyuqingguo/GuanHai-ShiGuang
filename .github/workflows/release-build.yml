name: Desktop release builds

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r optical_desk/requirements.txt "pyinstaller>=6,<7"
      - name: Run Windows and encrypted transfer tests
        env:
          PYTHONPATH: ${{ github.workspace }}/optical_desk
        run: |
          python -m unittest discover -s optical_desk/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -v
      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --clean build/GuanHaiShiGuang.spec
      - name: Verify packaged main window opens
        run: |
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class WindowProbe {
              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              private static extern IntPtr FindWindow(string className, string title);
              [DllImport("user32.dll")]
              private static extern bool IsWindowVisible(IntPtr window);
              public static bool HasVisibleWindow(string title) {
                  return IsWindowVisible(FindWindow(null, title));
              }
          }
          '@
          $exe = Start-Process -FilePath (Resolve-Path 'dist/GuanHaiShiGuang.exe') -PassThru
          try {
            for ($attempt = 0; $attempt -lt 45; $attempt++) {
              if ($exe.HasExited) { throw "Packaged application exited with code $($exe.ExitCode)" }
              if ([WindowProbe]::HasVisibleWindow('观海·拾光 v0.0.5')) {
                Write-Host 'Packaged main window is visible.'
                return
              }
              Start-Sleep -Seconds 1
            }
            Get-Process GuanHaiShiGuang | Format-Table Id, SessionId, MainWindowTitle, MainWindowHandle
            throw 'Packaged main window did not appear.'
          } finally {
            if (!$exe.HasExited) { taskkill /PID $exe.Id /T /F | Out-Null }
          }
      - name: Name release asset
        run: Move-Item dist/GuanHaiShiGuang.exe dist/GuanHaiShiGuang-0.0.5-Windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-x64
          path: dist/GuanHaiShiGuang-0.0.5-Windows-x64.exe
          if-no-files-found: error

  kylin:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Kylin Desktop V10 SP1 uses glibc 2.31 on AMD64 and ARM64.
    container: python:3.11-bullseye
    defaults:
      run:
        shell: bash
        working-directory: kylin_desk
    steps:
      - uses: actions/checkout@v4
      - name: Install smoke test tools
        run: |
          printf '%s\n' 'deb https://deb.debian.org/debian bullseye main' > /tmp/guanhai-apt.list
          apt_sources=(-o Dir::Etc::sourcelist=/tmp/guanhai-apt.list -o Dir::Etc::sourceparts=-)
          apt-get "${apt_sources[@]}" update
          apt-get "${apt_sources[@]}" install -y --no-install-recommends libxcursor1 xorriso xvfb xauth x11-utils
      - name: Run Linux tests
        run: python -m unittest discover -s tests -v
      - name: Build the offline executable
        run: |
          bash prepare_offline_deps.sh
          bash build_offline.sh
      - name: Verify packaged main window opens
        run: |
          xvfb-run -a bash -euo pipefail -c '
            ./dist/GuanHaiShiGuang > smoke.log 2>&1 &
            app_pid=$!
            trap "kill $app_pid 2>/dev/null || true; wait $app_pid 2>/dev/null || true; cat smoke.log" EXIT
            sleep 4
            for attempt in {1..30}; do
              kill -0 "$app_pid"
              window=$(xwininfo -root -tree | awk '\''/Kylin"/ && !id { id=$1 } END { print id }'\'')
              if [[ -n "$window" ]] && xwininfo -id "$window" | grep "Map State: IsViewable"; then
                test ! -s smoke.log
                exit 0
              fi
              sleep 1
            done
            xwininfo -root -tree
            exit 1
          '
      - name: Archive release asset
        run: |
          tar -czf "dist/GuanHaiShiGuang-0.0.1-Kylin-V10-SP1-${{ matrix.architecture }}.tar.gz" \
            -C dist GuanHaiShiGuang -C .. README.md
      - uses: actions/upload-artifact@v4
        with:
          name: Kylin-${{ matrix.architecture }}
          path: kylin_desk/dist/GuanHaiShiGuang-0.0.1-Kylin-V10-SP1-${{ matrix.architecture }}.tar.gz
          if-no-files-found: error

  stage-release:
    if: github.ref_type == 'tag'
    needs: [windows, kylin]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify and upload release files to the draft
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          windows=GuanHaiShiGuang-0.0.5-Windows-x64.exe
          amd64=GuanHaiShiGuang-0.0.1-Kylin-V10-SP1-amd64.tar.gz
          arm64=GuanHaiShiGuang-0.0.1-Kylin-V10-SP1-arm64.tar.gz
          file "$windows" | grep 'PE32+.*x86-64'
          mkdir -p "$RUNNER_TEMP/guanhai-amd64" "$RUNNER_TEMP/guanhai-arm64"
          tar -xzf "$amd64" -C "$RUNNER_TEMP/guanhai-amd64" GuanHaiShiGuang
          tar -xzf "$arm64" -C "$RUNNER_TEMP/guanhai-arm64" GuanHaiShiGuang
          test -x "$RUNNER_TEMP/guanhai-amd64/GuanHaiShiGuang"
          test -x "$RUNNER_TEMP/guanhai-arm64/GuanHaiShiGuang"
          file "$RUNNER_TEMP/guanhai-amd64/GuanHaiShiGuang" | grep 'ELF.*x86-64'
          file "$RUNNER_TEMP/guanhai-arm64/GuanHaiShiGuang" | grep 'ELF.*aarch64'
          sha256sum "$windows" "$amd64" "$arm64" | tee SHA256SUMS.txt
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
          gh release upload "$GITHUB_REF_NAME" "$windows" "$amd64" "$arm64" SHA256SUMS.txt
